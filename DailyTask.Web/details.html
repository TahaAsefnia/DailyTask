<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Details</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="details">
  <div class="container narrow">
    <header>
      <h1>Task Details</h1>
      <a class="btn" href="index.html">← Back</a>
    </header>

    <div class="card">
      <div class="detail-head">
        <span id="d-dot" class="dot"></span>
        <h2 id="d-title" class="detail-title"></h2>
      </div>

      <p id="d-desc" class="task-desc"></p>

      <div class="detail-meta">
        <span id="d-priority" class="badge"></span>
        <span id="d-status" class="badge"></span>
      </div>

      <div class="detail-actions">
        <button id="d-toggle" class="btn accent"></button>
        <a id="d-edit" class="btn" href="#">✏️ Edit</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
